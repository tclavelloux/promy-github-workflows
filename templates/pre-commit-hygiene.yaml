# Generic hygiene hooks (workflow-sync rule precommit-hygiene-hooks). Pin rev to a
# pre-commit-hooks release tag, never a branch.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The manifest declares pre-push on these hooks; default_stages does not override it.
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=1024]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
