# Canonical .github/workflows/ci.yml for a Flutter repo (workflow-sync Flutter
# profile: a root pubspec.yaml, no go.mod, no uv.lock).
#
# - Required jobs: lint, vuln, test, gitleaks. automerge is optional.
# - `lint` calls flutter-lint and `test` calls flutter-test. Both install the SDK
#   from the repo's .flutter-version, which must equal the fleet pin.
# - `vuln` calls flutter-vuln: osv-scanner over the root pubspec.lock, no SDK.
# - Required checks for protect-main: `lint / lint`, `vuln / vuln`, `test / test`,
#   `gitleaks` (the inline job below) and `pr-title / pr-title` (from pr-title.yml).
#   The reusable workflows fix the first three names.
# - Never path-filter a job: a required check that does not run blocks the PR.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.draft == false
    uses: tclavelloux/promy-github-workflows/.github/workflows/flutter-lint.yml@flutter-lint/v1
    with:
      workflow-sync: true

  vuln:
    if: github.event.pull_request.draft == false
    uses: tclavelloux/promy-github-workflows/.github/workflows/flutter-vuln.yml@flutter-vuln/v1

  test:
    if: github.event.pull_request.draft == false
    uses: tclavelloux/promy-github-workflows/.github/workflows/flutter-test.yml@flutter-test/v1
    with:
      timeout-minutes: 20

  gitleaks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks-action reads GET /repos/{repo}/pulls/{n}/commits to scope the scan
    # to the PR's commit range, so it needs pull-requests: read. It posts nothing.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # List EVERY other job in `needs:`. The in-workflow check-run verification is
  # the backstop, not the primary gate.
  automerge:
    needs: [lint, vuln, test, gitleaks]
    # No status function here, so GitHub implicitly ANDs success(): any failed,
    # cancelled or skipped need skips this job.
    if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'promy-fleet-bot[bot]'
    # Must match the reusable workflow's permissions exactly; it can only narrow.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
      statuses: read
    uses: tclavelloux/promy-github-workflows/.github/workflows/dependabot-automerge.yml@dependabot-automerge/v1
    # No `with: ecosystems: pub`: pub bumps stay human-reviewed (a 0.x minor bump
    # is breaking under caret).
    # Optional. With them, a Dependabot PR left behind its base under a strict
    # ruleset gets an App-authored `@dependabot rebase` comment; without them the
    # job only prints a notice. Map explicitly; never `secrets: inherit`.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
