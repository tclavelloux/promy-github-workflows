# Canonical `test` job of a Go caller's .github/workflows/ci.yml (profile: go).
# Replace `timeout-minutes` as the repo needs. Keep the pr-scope step and its `if:`
# gates: a docs-only or release PR then skips the 9-13 minute test run while the
# job, and the `coverage` job that follows it, still report a green check.
#
# The pr-scope block is byte-identical to scripts/pr-scope.sh
# (internal/syncheck/prscope_test.go compares them).
#
# The `go test` line must stay in step with `make check-coverage`; add services
# (databases, Redis) to the job as the repo's tests need.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth 2: pr-scope diffs the PR merge commit against its base parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect docs-only or release PR
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # >>> pr-scope body
          # Keep this block byte-identical between scripts/pr-scope.sh and every workflow
          # that inlines it (governance tests compare them).
          set +e
          out="${GITHUB_OUTPUT:-/dev/stdout}"

          # inert reports whether one path cannot affect any gate.
          inert() {
            case "$1" in
              *testdata*) return 1 ;; # fixtures are test inputs, whatever their extension
              .release-please-manifest.json) return 0 ;;
              docs/*.md) return 0 ;;
              */*) return 1 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          decide() {
            [ "${EVENT_NAME:-}" = "pull_request" ] || { reason="event is ${EVENT_NAME:-unset}, not pull_request"; return 1; }
            # A merge commit has two parents: "<sha> <p1> <p2>".
            [ "$(git rev-list --parents -n 1 HEAD 2>/dev/null | wc -w | tr -d ' ')" = 3 ] ||
              { reason="HEAD is not a merge commit with both parents fetched (checkout needs fetch-depth: 2)"; return 1; }
            local list n=0 f bad=""
            list="$(mktemp)"
            git diff --name-only -z --no-renames HEAD^1 HEAD >"$list" 2>/dev/null || { rm -f "$list"; reason="git diff failed"; return 1; }
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              if ! inert "$f"; then bad="$f"; break; fi
            done <"$list"
            rm -f "$list"
            # sanitised: the name lands in a workflow command
            [ -z "$bad" ] || { reason="${bad//[^[:alnum:]._\/-]/?} can affect a gate"; return 1; }
            [ "$n" -gt 0 ] || { reason="empty change set"; return 1; }
            reason="$n changed file(s), all docs or release metadata"
          }

          reason=""
          if decide; then skip=true; else skip=false; fi
          echo "skip=${skip}" >>"$out"
          echo "::notice title=pr-scope::skip=${skip}: ${reason}"
          # <<< pr-scope body

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: Run tests
        if: steps.scope.outputs.skip != 'true'
        run: go test -race -failfast -coverpkg=./... -covermode=atomic -coverprofile=coverage.raw.out -count=1 ./...

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.skip != 'true'
        with:
          name: coverage-profile
          path: coverage.raw.out
          retention-days: 1
          if-no-files-found: error
