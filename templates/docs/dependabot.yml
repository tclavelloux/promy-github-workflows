# Canonical .github/dependabot.yml for a docs-only repo (workflow-sync docs
# profile). workflow-sync requires only a github-actions entry at "/".
#
# - `prefix: build` pins the `build(deps):` title; pr-title.yml accepts it.
# - The github-actions group needs a human merge: GITHUB_TOKEN cannot merge
#   changes to workflow files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
