name: Python Docker

# Per project (matrix over `projects`): build the project's Dockerfile, no push,
# then run the image's `--help` as a smoke test. The Dockerfile is the only
# supported runtime of the fleet's Python jobs, so a green build is a required
# check. One job id (`docker`) keeps the caller's check names fixed:
# `docker / docker (src/store)`.
#
# The build context is the project directory (what its docker-compose.yml uses).
# Layers are cached in the GitHub Actions cache; COPY of uv.lock invalidates the
# dependency layer exactly when the lock changes, so no explicit lock key is needed.
# `.python-version` vs `FROM python:` and the uv tag are checked statically by
# python-lint; this workflow proves the build itself.

on:
  workflow_call:
    inputs:
      projects:
        description: 'JSON array of project directories, e.g. `["src/leaflet","src/store"]`. Each is a build context; the Dockerfile must exist, a missing one fails the job instead of being skipped.'
        required: true
        type: string
      dockerfile:
        description: Dockerfile path, relative to each project directory.
        required: false
        type: string
        default: Dockerfile
      smoke-command:
        description: Command run in the built image (`docker run --rm <image> <command>`). Must exit 0. Word-split without globbing.
        required: false
        type: string
        default: python main.py --help

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    steps:
      # fetch-depth 2: pr-scope diffs the PR merge commit against its base parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Docs-only and release PRs (CHANGELOG.md + manifest) skip the expensive steps
      # but keep every job, so required check names still report. Fails open.
      # The block between the markers is byte-identical to scripts/pr-scope.sh.
      - name: Detect docs-only or release PR
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # >>> pr-scope body
          # Keep this block byte-identical between scripts/pr-scope.sh and every workflow
          # that inlines it (governance tests compare them).
          set +e
          out="${GITHUB_OUTPUT:-/dev/stdout}"

          # inert reports whether one path cannot affect any gate.
          inert() {
            case "$1" in
              *testdata*) return 1 ;; # fixtures are test inputs, whatever their extension
              .release-please-manifest.json) return 0 ;;
              docs/*.md) return 0 ;;
              */*) return 1 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          decide() {
            [ "${EVENT_NAME:-}" = "pull_request" ] || { reason="event is ${EVENT_NAME:-unset}, not pull_request"; return 1; }
            # A merge commit has two parents: "<sha> <p1> <p2>".
            [ "$(git rev-list --parents -n 1 HEAD 2>/dev/null | wc -w | tr -d ' ')" = 3 ] ||
              { reason="HEAD is not a merge commit with both parents fetched (checkout needs fetch-depth: 2)"; return 1; }
            local list n=0 f bad=""
            list="$(mktemp)"
            git diff --name-only -z --no-renames HEAD^1 HEAD >"$list" 2>/dev/null || { rm -f "$list"; reason="git diff failed"; return 1; }
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              if ! inert "$f"; then bad="$f"; break; fi
            done <"$list"
            rm -f "$list"
            # sanitised: the name lands in a workflow command
            [ -z "$bad" ] || { reason="${bad//[^[:alnum:]._\/-]/?} can affect a gate"; return 1; }
            [ "$n" -gt 0 ] || { reason="empty change set"; return 1; }
            reason="$n changed file(s), all docs or release metadata"
          }

          reason=""
          if decide; then skip=true; else skip=false; fi
          echo "skip=${skip}" >>"$out"
          echo "::notice title=pr-scope::skip=${skip}: ${reason}"
          # <<< pr-scope body

      - name: Require Dockerfile
        id: image
        env:
          PROJECT: ${{ matrix.project }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [ ! -f "${PROJECT}/${DOCKERFILE}" ]; then
            echo "::error::${PROJECT}/${DOCKERFILE} not found. Every project in the projects input needs a Dockerfile; nothing was built."
            exit 1
          fi
          # Image names and cache scopes cannot carry '/', so slug the path.
          slug="$(printf '%s' "$PROJECT" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/^-*//; s/-*$//')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.skip != 'true'

      - name: Build image
        if: steps.scope.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.project }}
          file: ${{ matrix.project }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: promy-ci-build/${{ steps.image.outputs.slug }}:ci
          cache-from: type=gha,scope=docker-${{ steps.image.outputs.slug }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.image.outputs.slug }}

      - name: Smoke test
        if: steps.scope.outputs.skip != 'true'
        env:
          IMAGE: promy-ci-build/${{ steps.image.outputs.slug }}:ci
          SMOKE: ${{ inputs.smoke-command }}
        run: |
          # `smoke-command` is intentionally word-split, but a bare $SMOKE would
          # also glob. read -ra splits on IFS without globbing.
          read -ra cmd <<< "$SMOKE"
          docker run --rm "$IMAGE" "${cmd[@]}"
