name: PR Title

on:
  workflow_call:
    inputs:
      types:
        description: Allowed Conventional Commits types, newline-separated. Each entry is a regex auto-wrapped in `^ $` by the action. Defaults to the set the fleet already uses.
        required: false
        type: string
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
      require-scope:
        description: "Require a scope in the PR title (`feat(api): ...` rather than `feat: ...`)."
        required: false
        type: boolean
        default: false
      subject-pattern:
        description: Regex the subject must match. The default only rejects an empty subject; tighten it per-caller (e.g. `^(?![A-Z]).+$` to ban a leading capital).
        required: false
        type: string
        default: ^.+$
      subject-pattern-error:
        description: Error message shown when `subject-pattern` does not match. `{subject}` and `{title}` are substituted by the action.
        required: false
        type: string
        default: |
          The subject "{subject}" found in the pull request title "{title}"
          doesn't match the configured pattern. The subject must not be empty.

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads the title straight off the event payload and reports a check run.
      # No checkout: the workflow never touches the caller's tree, so there is
      # nothing to check out and no credential to persist.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.require-scope }}
          subjectPattern: ${{ inputs.subject-pattern }}
          subjectPatternError: ${{ inputs.subject-pattern-error }}
