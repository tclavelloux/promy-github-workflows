name: Flutter Vulnerability Check

# osv-scanner over the root pubspec.lock. Dart has no reachability analysis, so
# ANY known advisory in the lock fails, minus the expiring ignores in the root
# osv-scanner.toml. One job id (`vuln`) keeps the caller's check name fixed:
# `vuln / vuln`. No Flutter SDK is needed: osv-scanner parses the lock file.
#
# Config: `osv-scanner.toml` at the repo root, else none. Every ignore should
# carry `ignoreUntil` and `reason`; osv-scanner re-reports a vulnerability once
# its `ignoreUntil` has passed.

on:
  workflow_call:
    inputs:
      osv-scanner-version:
        description: osv-scanner version to install (with or without a leading `v`). The single place the fleet's scanner version is decided. A different version needs its own `osv-scanner-sha256`.
        required: false
        type: string
        default: 2.7.0
      osv-scanner-sha256:
        description: Expected sha256 of the `osv-scanner_linux_amd64` release asset for `osv-scanner-version`. The download is rejected on any mismatch.
        required: false
        type: string
        default: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
      args:
        description: Extra one-off flags appended to `osv-scanner scan source` (e.g. `--format=json`). Word-split without globbing.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner
        env:
          RAW_VERSION: ${{ inputs.osv-scanner-version }}
          EXPECTED_SHA256: ${{ inputs.osv-scanner-sha256 }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          url="https://github.com/google/osv-scanner/releases/download/v${version}/osv-scanner_linux_amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" "$url"
          # Verify against the pinned digest, not against a checksum file fetched
          # from the same release: a tampered release would ship a matching file.
          actual="$(sha256sum "$RUNNER_TEMP/osv-scanner" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::osv-scanner v${version} sha256 is ${actual}, expected ${EXPECTED_SHA256}. If you changed osv-scanner-version, pass the matching osv-scanner-sha256."
            exit 1
          fi
          install -m 0755 "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
          osv-scanner --version


      - name: Run osv-scanner
        env:
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          lock="pubspec.lock"
          if [ ! -f "$lock" ]; then
            echo "::error::${lock} not found. The repo needs a committed lock; nothing was scanned."
            exit 1
          fi
          config=()
          if [ -f osv-scanner.toml ]; then
            config=(--config osv-scanner.toml)
          fi
          echo "scanning ${lock} (config: ${config[*]-none})"
          # `args` is intentionally word-split, but a bare $ARGS would also glob.
          # read -ra splits on IFS without globbing.
          read -ra extra_args <<< "$ARGS"
          if ! osv-scanner scan source ${config[@]+"${config[@]}"} --lockfile "$lock" ${extra_args[@]+"${extra_args[@]}"}; then
            echo "::error file=${lock}::osv-scanner reported vulnerabilities or failed. Bump the package with 'flutter pub upgrade <name>', or add an osv-scanner.toml [[IgnoredVulns]] entry with reason and ignoreUntil."
            exit 1
          fi
