name: Go Vulnerability Check

on:
  workflow_call:
    inputs:
      govulncheck-version:
        description: govulncheck version to install (with or without a leading `v`). The single place the fleet's vuln-scanner version is decided.
        required: false
        type: string
        default: v1.9.0
      go-version-file:
        description: Path to the go.mod (or go.work) file used to resolve the Go toolchain version.
        required: false
        type: string
        default: go.mod
      args:
        description: Extra one-off flags/patterns appended to `govulncheck` (e.g. a narrower package pattern than `./...`). `-format` and `-json` are refused; the gate owns the output format.
        required: false
        type: string
        default: ./...

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Resolve govulncheck version
        id: version
        env:
          RAW_VERSION: ${{ inputs.govulncheck-version }}
        run: |
          # Normalize: strip a leading 'v' if present, then re-add it consistently,
          # mirroring go-lint.yml's own golangci-lint-version handling.
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache govulncheck binary
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-v${{ steps.version.outputs.version }}-${{ runner.os }}

      - name: Install govulncheck
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # setup-go v7 defaults GOTOOLCHAIN to `local`, which makes `go install`
          # refuse any tool whose go.mod requires a newer Go than the caller's.
          # v5.6.0 defaulted to `auto`; restore that explicitly rather than
          # inherit whatever the action decides next.
          GOTOOLCHAIN: auto
        run: go install "golang.org/x/vuln/cmd/govulncheck@v${VERSION}"

      - name: Print govulncheck version
        run: govulncheck -version

      - name: Run govulncheck
        # Interpolate inputs via env rather than directly into the shell: inputs
        # are caller-controlled strings, and direct `${{ inputs.* }}` interpolation
        # into `run:` is a shell-injection surface. Same convention as go-lint.yml
        # and go-coverage.yml.
        shell: bash
        env:
          ARGS: ${{ inputs.args }}
          # Accepted no-fix advisories, one per line:
          #   <GO-ID> <expires YYYY-MM-DD> <tracking issue URL> <reason>
          # A literal, not an input, so a caller cannot widen it. Inlined rather than
          # a file: a reusable workflow cannot read its own repo at the caller's ref.
          # Renew or remove by PR; an expired entry fails the job. Shape is checked by
          # internal/syncheck/go_vuln_gate_test.go (expiry at most 90 days ahead).
          GO_VULN_ACCEPT: |
            GO-2026-6875 2026-12-11 https://github.com/tclavelloux/promy-github-workflows/issues/78 echo reverse proxy forwards X-Real-IP; middleware.Proxy unused fleet-wide and not enabled by Yokai fxhttpserver v1.8.0
            GO-2026-6872 2026-12-11 https://github.com/tclavelloux/promy-github-workflows/issues/78 echo rate limiter trusts X-Forwarded-For; middleware.RateLimiter unused fleet-wide and not enabled by Yokai fxhttpserver v1.8.0
        run: |
          set -euo pipefail

          # >>> go-vuln-gate body
          # Keep this block byte-identical between scripts/go-vuln-gate.sh and
          # .github/workflows/go-vuln.yml (governance CI diffs them).
          # Usage: go_vuln_gate <govulncheck-binary> [args...]   (run from the module root)
          # Env: GO_VULN_ACCEPT (list), GO_VULN_TODAY (optional), GITHUB_STEP_SUMMARY (optional).
          # Return codes: 0 clean or only accepted, 1 called advisory not accepted or expired,
          # 2 scanner, list or argument error.
          # Days since 1970-01-01 for a YYYY-MM-DD date, pure bash (no `date -d` on macOS).
          go_vuln_days() {
            local y=$((10#${1:0:4})) m=$((10#${1:5:2})) d=$((10#${1:8:2})) era yoe doy doe
            y=$((m <= 2 ? y - 1 : y))
            era=$((y / 400))
            yoe=$((y - era * 400))
            doy=$(((153 * (m > 2 ? m - 3 : m + 9) + 2) / 5 + d - 1))
            doe=$((yoe * 365 + yoe / 4 - yoe / 100 + doy))
            echo $((era * 146097 + doe - 719468))
          }
          go_vuln_gate() {
            local bin="$1"
            shift
            local called='.[] | select(.finding) | .finding | select(.trace[0].function != null)'
            local today="${GO_VULN_TODAY:-$(date -u +%F)}"
            local entries="" bad=0 n=0 line id exp url reason a y m d dim json ids detail
            local status expires issue fail=0 summary="" rows="" reached="" left
            # An accepted entry this close to expiry warns instead of a notice, so the
            # renewal PR lands before the job turns red. Inclusive of the expiry day.
            local warn_days=14

            command -v jq > /dev/null || {
              echo "::error title=go-vuln gate::jq is required"
              return 2
            }

            for a in "$@"; do
              case "$a" in
                -format | -format=* | --format | --format=* | -json | -json=* | --json | --json=*)
                  echo "::error title=go-vuln gate::the gate owns the output format; remove '$a' from args"
                  return 2
                  ;;
              esac
            done

            while IFS= read -r line; do
              n=$((n + 1))
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              case "$line" in '' | '#'*) continue ;; esac
              read -r id exp url reason <<< "$line" || true
              if ! [[ "$id" =~ ^GO-[0-9]{4}-[0-9]{4,}$ ]]; then
                echo "::error title=go-vuln accept list::line $n: invalid advisory ID '$id'"
                bad=1
                continue
              fi
              if [[ "$exp" =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
                y=$((10#${BASH_REMATCH[1]}))
                m=$((10#${BASH_REMATCH[2]}))
                d=$((10#${BASH_REMATCH[3]}))
                case "$m" in
                  1 | 3 | 5 | 7 | 8 | 10 | 12) dim=31 ;;
                  4 | 6 | 9 | 11) dim=30 ;;
                  2) if { [ $((y % 4)) -eq 0 ] && [ $((y % 100)) -ne 0 ]; } || [ $((y % 400)) -eq 0 ]; then dim=29; else dim=28; fi ;;
                  *) dim=0 ;;
                esac
                if [ "$d" -lt 1 ] || [ "$d" -gt "$dim" ]; then
                  echo "::error title=go-vuln accept list::line $n ($id): '$exp' is not a real date"
                  bad=1
                  continue
                fi
              else
                echo "::error title=go-vuln accept list::line $n ($id): expiry '$exp' is not YYYY-MM-DD"
                bad=1
                continue
              fi
              if ! [[ "$url" =~ ^https://github\.com/tclavelloux/[A-Za-z0-9._-]+/issues/[0-9]+$ ]]; then
                echo "::error title=go-vuln accept list::line $n ($id): tracking link '$url' is not a https://github.com/tclavelloux/<repo>/issues/<n> URL"
                bad=1
                continue
              fi
              if [ -z "$reason" ]; then
                echo "::error title=go-vuln accept list::line $n ($id): reason is empty"
                bad=1
                continue
              fi
              if printf '%s' "$entries" | awk -v id="$id" '$1 == id { f = 1 } END { exit !f }'; then
                echo "::error title=go-vuln accept list::line $n: duplicate entry for $id"
                bad=1
                continue
              fi
              entries="${entries}${id} ${exp} ${url}"$'\n'
            done <<< "${GO_VULN_ACCEPT:-}"
            if [ "$bad" -ne 0 ]; then
              return 2
            fi

            # govulncheck -format json exits 0 even when it finds vulnerabilities, so a
            # non-zero exit here is a scanner failure, never a finding.
            if ! json=$("$bin" -format json "$@"); then
              echo "::error title=govulncheck failed::scanner error, failing closed"
              return 2
            fi
            if ! ids=$(printf '%s\n' "$json" | jq -r -s "$called | .osv" | sort -u); then
              echo "::error title=go-vuln gate::cannot parse govulncheck JSON output"
              return 2
            fi

            while IFS= read -r id; do
              [ -n "$id" ] || continue
              reached="${reached}${id}"$'\n'
              expires="" issue=""
              read -r _ expires issue < <(printf '%s' "$entries" | awk -v id="$id" '$1 == id { print; exit }') || true
              if [ -z "${expires:-}" ]; then
                status="not accepted"
                expires="-"
                issue="-"
                fail=1
                detail=$(printf '%s\n' "$json" | jq -r -s --arg id "$id" "[$called | select(.osv == \$id)]
                  | map(\"  vulnerable: \" + ((.trace[0].package // .trace[0].module) + \".\" + .trace[0].function)
                    + \" reached from \" + ((.trace[1:] | map(select(.position)) | first // null)
                    | if . == null then \"(no positioned caller)\" else (.position.filename + \":\" + (.position.line | tostring)) end))
                  | unique | .[]" | awk 'NR <= 10')
                echo "::error title=vulnerable dependency::$id is called and not accepted: https://pkg.go.dev/vuln/$id"
                printf '%s\n' "$detail"
              elif [[ "$expires" < "$today" ]]; then
                status="expired"
                fail=1
                echo "::error title=accepted advisory expired::$id acceptance expired $expires ($issue); renew by PR or fix"
              else
                left=$(($(go_vuln_days "$expires") - $(go_vuln_days "$today")))
                if [ "$left" -le "$warn_days" ]; then
                  status="expiring"
                  echo "::warning title=accepted advisory expiring::$id acceptance expires $expires ($issue); renew by PR or fix"
                else
                  status="accepted"
                  echo "::notice title=accepted advisory::$id accepted until $expires ($issue)"
                fi
              fi
              rows="${rows}| $id | $status | $expires | $issue |"$'\n'
            done <<< "$ids"

            while read -r id expires issue; do
              [ -n "$id" ] || continue
              if ! printf '%s' "$reached" | grep -qx "$id"; then
                rows="${rows}| $id | not reached | $expires | $issue |"$'\n'
              fi
            done <<< "$entries"

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -n "$rows" ]; then
              summary="### Accepted advisories"$'\n\n'"| ID | Status | Expires | Issue |"$'\n'"|---|---|---|---|"$'\n'"$rows"
              printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi

            return "$fail"
          }
          # <<< go-vuln-gate body

          # `args` is intentionally word-split into separate flags/patterns, but a
          # bare $ARGS would also glob. read -ra splits on IFS without globbing.
          read -ra extra_args <<< "$ARGS"
          # `& wait` instead of `|| rc=$?`: a `||` list would disable errexit
          # inside the function and let an unexpected failure read as "clean".
          go_vuln_gate "$(command -v govulncheck)" "${extra_args[@]}" & wait "$!"
