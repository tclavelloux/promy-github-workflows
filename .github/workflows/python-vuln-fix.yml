name: Python Vulnerability Fix

# Weekly, patches the Python advisories osv-scanner reports in each project's
# uv.lock: per vulnerable package it asks uv to move to the lowest version that
# fixes every advisory (`uv lock --upgrade-package <pkg>==<fixed>`, one package at
# a time), verifies a clean rescan of the patched lock, then opens ONE
# `fix(deps)` PR holding every changed uv.lock. Nothing else is edited: not
# pyproject.toml, not a Dockerfile, not a requirement.
#
# What it refuses, and where that goes: a package matched by `exclude-dependencies`,
# a major bump (unless `allow-major`), an advisory with no fixed version, a fix
# outside the project's own constraints (uv says unsatisfiable), a resolver that
# picks another version, and a lock change that would drag an excluded or major
# dependency along. Each refusal restores the lock and lands in one rolling issue
# (`security: Python advisories need a human`), which is never closed
# automatically. Benign side effects of a bump (other patch or minor moves) are
# kept and listed in the PR. A failed rescan restores that whole project.
#
# Why it exists next to Dependabot: Dependabot's `uv-security` group only fixes
# advisories GitHub's own database lists (GHSA); osv-scanner, and so the `vuln`
# job that gates every PR, also reports PYSEC and other OSV-only ids. This
# workflow fills that gap. When Dependabot lands the same bump first, the next
# run finds nothing to fix and closes the now-stale `fix/py-vuln-*` PR.
#
# Call it from a `schedule` + `workflow_dispatch` caller; see
# templates/python/vuln-fix.yml. Weekly (Thursday) because Dependabot's sweep
# already runs Monday, and the pre-push hook plus every PR's `vuln` job surface
# advisories sooner locally.
#
# uv version: read from the caller's `.uv-version`, the same pin python-lint
# enforces. The fleet pin tracks the uv version Dependabot writes locks with, so
# a fix run leaves the lock's style untouched. A lock last written by a newer uv
# than the pin gets rewritten in the newer uv's style (e.g. extra `marker = ...`
# entries) when a resolution runs; the lock stays valid, Dependabot rewrites it.
#
# CI on the PR: when the caller passes the optional APP_CLIENT_ID and
# APP_PRIVATE_KEY secrets, the PR is opened with a GitHub App installation
# token, so CI runs on it. Without them the workflow falls back to GITHUB_TOKEN,
# which by design starts no workflows: CI does NOT run on the PR, a human must
# close and reopen it (fires `reopened`) or push a commit before merging, and
# the PR body says so.
#
# This workflow never merges and never enables auto-merge. A caller's
# dependabot-automerge job (v1.2.0+) merges the App-opened PR when its diff is
# patch-level only and CI is green; otherwise a human merges it. A PR opened
# with GITHUB_TOKEN runs no CI and is never auto-merged.
#
# The fix logic is inlined below, not read from scripts/python_vuln_fix.py: a
# reusable workflow has no documented context exposing its own ref, so it cannot
# check out its own files at the pinned version. The block between the
# `python-vuln-fix body` markers must stay byte-identical to the same block in
# scripts/python_vuln_fix.py (governance Go tests compare them); the script has
# the unit tests.

on:
  workflow_call:
    inputs:
      projects:
        description: 'JSON array of uv project directories, e.g. `["src/leaflet","src/store"]`. Every entry needs a tracked uv.lock; a missing lock fails the job instead of passing with nothing scanned. Same input as python-vuln.'
        required: true
        type: string
      osv-scanner-version:
        description: osv-scanner version to install (with or without a leading `v`). MUST equal python-vuln.yml's default; governance CI enforces it, so change both together or not at all. A different version needs its own `osv-scanner-sha256`.
        required: false
        type: string
        default: 2.6.0
      osv-scanner-sha256:
        description: Expected sha256 of the `osv-scanner_linux_amd64` release asset for `osv-scanner-version`. MUST equal python-vuln.yml's default. The download is rejected on any mismatch.
        required: false
        type: string
        default: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
      exclude-dependencies:
        description: Newline- or comma-separated globs of package names this workflow must never move (`torch*`, `numpy`). Names are PEP 503-normalised on both sides and matched whole, so `numpy` does not match `numpy-financial`. Same syntax as dependabot-automerge's input; mirror its list. An excluded advisory goes to the rolling issue.
        required: false
        type: string
        default: ''
      allow-major:
        description: Let a fix cross a major version (the first release segment rises). false sends it to the rolling issue. Calendar versions (first segment >= 1000 on both sides, e.g. certifi 2024 -> 2026) are never a major.
        required: false
        type: boolean
        default: false
      base-branch:
        description: Branch to scan and open the PR against. Empty means the repository default branch.
        required: false
        type: string
        default: ''
    secrets:
      APP_CLIENT_ID:
        description: Client ID of a GitHub App installed on the repository with contents and pull-requests write. With APP_PRIVATE_KEY, the fix PR is opened by the App so CI runs on it.
        required: false
      APP_PRIVATE_KEY:
        description: Private key of that GitHub App.
        required: false

# The caller's job must grant exactly these: a called workflow can only narrow
# the caller's permissions, never widen them.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets cannot be read in a step `if:`; expose whether both are set.
      HAS_APP: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Scan the branch the PR targets, not the dispatched ref: a dispatch from
          # another branch then only picks the caller file, never the scanned code.
          ref: ${{ inputs.base-branch || github.event.repository.default_branch }}

      - name: Resolve uv version
        id: uv
        run: |
          # .uv-version is the repo's pin; a missing pin is an error, never "latest".
          if [ ! -s .uv-version ]; then
            echo "::error file=.uv-version::.uv-version is missing or empty. It is the source of truth for the uv version."
            exit 1
          fi
          version="$(head -n1 .uv-version | tr -d '[:space:]')"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error file=.uv-version::.uv-version must hold one plain version such as 0.12.18, found '${version}'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: false

      - name: Install osv-scanner
        env:
          RAW_VERSION: ${{ inputs.osv-scanner-version }}
          EXPECTED_SHA256: ${{ inputs.osv-scanner-sha256 }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          url="https://github.com/google/osv-scanner/releases/download/v${version}/osv-scanner_linux_amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" "$url"
          # Verify against the pinned digest, not against a checksum file fetched
          # from the same release: a tampered release would ship a matching file.
          actual="$(sha256sum "$RUNNER_TEMP/osv-scanner" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::osv-scanner v${version} sha256 is ${actual}, expected ${EXPECTED_SHA256}. If you changed osv-scanner-version, pass the matching osv-scanner-sha256."
            exit 1
          fi
          install -m 0755 "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan and patch
        id: fix
        env:
          PROJECTS: ${{ inputs.projects }}
          EXCLUDE: ${{ inputs.exclude-dependencies }}
          ALLOW_MAJOR: ${{ inputs.allow-major }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/python_vuln_fix.py" <<'PY'
          # >>> python-vuln-fix body
          # Keep this block byte-identical between scripts/python_vuln_fix.py and
          # .github/workflows/python-vuln-fix.yml (governance CI diffs them).
          import argparse
          import collections
          import fnmatch
          import hashlib
          import json
          import os
          import posixpath
          import re
          import shutil
          import subprocess
          import sys

          if sys.version_info < (3, 11):
              sys.exit("::error::python-vuln-fix needs Python >= 3.11 (tomllib)")
          import tomllib

          PROJECT_RE = re.compile(r"^[A-Za-z0-9._/-]+$")
          GLOB_RE = re.compile(r"^[A-Za-z0-9._@/*?+-]+$")
          ID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$")
          NAME_RE = re.compile(r"^[a-z0-9][a-z0-9._-]{0,99}$")
          VERSION_TEXT_RE = re.compile(r"^[A-Za-z0-9.+!_-]{1,64}$")
          SEVERITY_RE = re.compile(r"^[0-9]{1,2}(\.[0-9]{1,2})?$")
          REFUSAL_RE = re.compile(r"No solution found|unsatisfiable", re.IGNORECASE)
          MARKER = "<!-- python-vuln-fix:unfixed -->"
          ISSUE_TITLE = "security: Python advisories need a human"

          VERSION_RE = re.compile(
              r"^\s*v?(?:(?P<epoch>[0-9]+)!)?(?P<release>[0-9]+(?:\.[0-9]+)*)"
              r"(?:[-_.]?(?P<pre_l>alpha|a|beta|b|preview|pre|c|rc)[-_.]?(?P<pre_n>[0-9]+)?)?"
              r"(?:(?:-(?P<post_n1>[0-9]+))|(?:[-_.]?(?P<post_l>post|rev|r)[-_.]?(?P<post_n2>[0-9]+)?))?"
              r"(?:[-_.]?(?P<dev_l>dev)[-_.]?(?P<dev_n>[0-9]+)?)?"
              r"(?:\+(?P<local>[a-z0-9]+(?:[-_.][a-z0-9]+)*))?\s*$",
              re.IGNORECASE,
          )
          PRE_ORDER = {"a": 0, "b": 1, "rc": 2}
          PRE_ALIAS = {"alpha": "a", "beta": "b", "c": "rc", "pre": "rc", "preview": "rc"}


          class UsageError(Exception):
              """Bad input or a scanner failure: exit 2."""


          class UvError(Exception):
              """uv failed for a reason other than a resolver refusal: exit 4."""


          class Version:
              """A PEP 440 version ordered like `packaging`, minus the local segment."""

              def __init__(self, text, epoch, release, key):
                  self.text, self.epoch, self.release, self.key = text, epoch, release, key

              def __lt__(self, other):
                  return self.key < other.key

              def __le__(self, other):
                  return self.key <= other.key

              def __eq__(self, other):
                  return isinstance(other, Version) and self.key == other.key

              def __hash__(self):
                  return hash(self.key)


          def parse_version(text):
              """Parse a PEP 440 version; None when it is not one. A local `+cpu` never affects ordering."""
              m = VERSION_RE.match(text or "")
              if not m:
                  return None
              epoch = int(m.group("epoch") or 0)
              release = tuple(int(x) for x in m.group("release").split("."))
              pre = None
              if m.group("pre_l"):
                  letter = m.group("pre_l").lower()
                  pre = (PRE_ALIAS.get(letter, letter), int(m.group("pre_n") or 0))
              post = None
              if m.group("post_n1") is not None:
                  post = int(m.group("post_n1"))
              elif m.group("post_l"):
                  post = int(m.group("post_n2") or 0)
              dev = int(m.group("dev_n") or 0) if m.group("dev_l") else None
              rel = list(release)
              while rel and rel[-1] == 0:
                  rel.pop()
              if pre is None and post is None and dev is not None:
                  pre_key = (-1, 0)
              elif pre is None:
                  pre_key = (9, 0)
              else:
                  pre_key = (PRE_ORDER[pre[0]], pre[1])
              key = (epoch, tuple(rel), pre_key, -1 if post is None else post, 10**18 if dev is None else dev)
              return Version(text, epoch, release, key)


          def is_major(old, new):
              """True when the first release segment rises. CalVer (both >= 1000) is never a major."""
              a, b = parse_version(old), parse_version(new)
              if a is None or b is None:
                  return True
              if a.release[0] >= 1000 and b.release[0] >= 1000:
                  return False
              return b.epoch > a.epoch or b.release[0] > a.release[0]


          def norm_name(name):
              """PEP 503 normalisation."""
              return re.sub(r"[-_.]+", "-", str(name)).lower()


          def parse_excludes(text):
              """Newline- or comma-separated globs, normalised like package names."""
              out = []
              for raw in re.split(r"[\n,]", text or ""):
                  raw = raw.strip()
                  if not raw:
                      continue
                  if not GLOB_RE.match(raw):
                      raise UsageError("invalid exclude entry: only [A-Za-z0-9._@/*?+-] are allowed in a glob")
                  out.append((raw, norm_name(raw)))
              return out


          def excluded_by(name, excludes):
              """The first glob matching the package name, else None. `numpy` does not match `numpy-financial`."""
              for raw, glob in excludes:
                  if fnmatch.fnmatchcase(name, glob):
                      return raw
              return None


          def as_dict(x):
              return x if isinstance(x, dict) else {}


          def as_list(x):
              return x if isinstance(x, list) else []


          def clean_text(text, limit=1500):
              """Make untrusted tool output safe for a fenced Markdown block."""
              text = text.replace("\r", "")
              text = "".join(c if c == "\n" or (c.isprintable() and c != "`") else " " for c in text)
              text = text.replace("~~~", "~~")
              return text.strip()[-limit:]


          def cell(text):
              return str(text).replace("|", "/").replace("\n", " ").replace("\t", " ")


          class Dropped:
              count = 0


          def safe_id(raw):
              if isinstance(raw, str) and ID_RE.match(raw):
                  return raw
              Dropped.count += 1
              return None


          class Pkg:
              """One vulnerable package: the installed versions and its advisory groups."""

              def __init__(self, name):
                  self.name = name
                  self.installed = []
                  self.groups = []  # {"ids": [...], "severity": float|None, "fix": str|None}


          def fixed_versions(vuln, name, installed):
              """Minimal fixed version among ECOSYSTEM ranges whose [introduced, fixed) holds `installed`."""
              best = None
              for aff in as_list(as_dict(vuln).get("affected")):
                  aff = as_dict(aff)
                  pkg = as_dict(aff.get("package"))
                  if pkg.get("ecosystem") != "PyPI" or norm_name(pkg.get("name", "")) != name:
                      continue
                  for rng in as_list(aff.get("ranges")):
                      rng = as_dict(rng)
                      if rng.get("type") != "ECOSYSTEM":
                          continue
                      intro = None
                      for ev in as_list(rng.get("events")):
                          ev = as_dict(ev)
                          if "introduced" in ev:
                              intro = parse_version(str(ev["introduced"]))
                          elif "fixed" in ev:
                              fx = str(ev["fixed"])
                              fv = parse_version(fx)
                              if intro is not None and fv is not None and VERSION_TEXT_RE.match(fx) and intro <= installed < fv:
                                  if best is None or fv < parse_version(best):
                                      best = fx
                              intro = None
                          elif "last_affected" in ev:
                              intro = None
              return best


          def extract(report):
              """Vulnerable packages from an osv-scanner JSON report, untrusted values dropped."""
              pkgs = {}
              for res in as_list(as_dict(report).get("results")):
                  for entry in as_list(as_dict(res).get("packages")):
                      entry = as_dict(entry)
                      info = as_dict(entry.get("package"))
                      if info.get("ecosystem") != "PyPI":
                          continue
                      name = norm_name(info.get("name", ""))
                      version = info.get("version")
                      if not NAME_RE.match(name) or not isinstance(version, str) or not VERSION_TEXT_RE.match(version):
                          Dropped.count += 1
                          continue
                      installed = parse_version(version)
                      vulns = {v.get("id"): v for v in map(as_dict, as_list(entry.get("vulnerabilities")))}
                      pkg = pkgs.setdefault(name, Pkg(name))
                      pkg.installed.append(version)
                      for grp in map(as_dict, as_list(entry.get("groups"))):
                          raw_ids = [i for i in as_list(grp.get("ids")) if isinstance(i, str)]
                          ids = sorted({i for i in map(safe_id, raw_ids) if i})
                          if not ids:
                              continue
                          sev = str(grp.get("max_severity", ""))
                          severity = float(sev) if SEVERITY_RE.match(sev) else None
                          fix = None
                          if installed is not None:
                              # Every alias must be fixed for the group to disappear: take the highest minimum.
                              for rid in raw_ids:
                                  cand = fixed_versions(vulns.get(rid), name, installed)
                                  if cand is not None and (fix is None or parse_version(fix) < parse_version(cand)):
                                      fix = cand
                          pkg.groups.append({"ids": ids, "severity": severity, "fix": fix})
              return pkgs


          def lock_versions(path):
              """{normalised name: Counter(version)} for every [[package]] of a uv.lock."""
              with open(path, "rb") as f:
                  data = tomllib.load(f)
              out = {}
              for p in as_list(data.get("package")):
                  p = as_dict(p)
                  out.setdefault(norm_name(p.get("name", "")), collections.Counter())[str(p.get("version", ""))] += 1
              return out


          def lock_diff(before, after, skip):
              """{name: (removed versions, added versions)} for every package other than `skip` that differs."""
              out = {}
              for name in sorted(set(before) | set(after)):
                  if name == skip:
                      continue
                  b, a = before.get(name, collections.Counter()), after.get(name, collections.Counter())
                  if b != a:
                      out[name] = (sorted((b - a).elements()), sorted((a - b).elements()))
              return out


          def max_version(versions):
              return max(versions, key=lambda v: parse_version(v).key)


          def sev_text(values):
              values = [v for v in values if v is not None]
              return ("%g" % max(values)) if values else "unknown"


          class Ctx:
              def __init__(self, root, osv, uv, excludes, allow_major):
                  self.root, self.osv, self.uv = root, osv, uv
                  self.excludes, self.allow_major = excludes, allow_major
                  self.restore = {}  # lock path -> original bytes, for every project touched


          def scan(ctx, project, lock_rel):
              """Run osv-scanner over one lock: {} when clean, the parsed report on findings."""
              cmd = [ctx.osv, "scan", "source"]
              if os.path.isfile(os.path.join(ctx.root, project, "osv-scanner.toml")):
                  cmd += ["--config", posixpath.join(project, "osv-scanner.toml")]
              elif os.path.isfile(os.path.join(ctx.root, "osv-scanner.toml")):
                  cmd += ["--config", "osv-scanner.toml"]
              cmd += ["--lockfile", lock_rel, "--format", "json"]
              try:
                  proc = subprocess.run(cmd, cwd=ctx.root, capture_output=True, text=True)
              except OSError as e:
                  raise UsageError(f"cannot run osv-scanner: {e.strerror}")
              if proc.returncode == 0:
                  return {}
              if proc.returncode != 1:
                  raise UsageError(f"osv-scanner failed on {lock_rel} (exit {proc.returncode})")
              try:
                  return json.loads(proc.stdout)
              except ValueError:
                  raise UsageError(f"osv-scanner printed no JSON for {lock_rel}")


          def run_uv(ctx, project_dir, args):
              env = dict(os.environ, NO_COLOR="1")
              try:
                  return subprocess.run([ctx.uv] + args, cwd=project_dir, capture_output=True, text=True, env=env)
              except OSError as e:
                  raise UsageError(f"cannot run uv: {e.strerror}")


          def write_lock(path, data):
              with open(path, "wb") as f:
                  f.write(data)


          def fix_project(ctx, project):
              """Fix one project. Returns {"fixed", "cascades", "unfixed", "aborted"}; refusals never raise."""
              lock_rel = posixpath.normpath(posixpath.join(project, "uv.lock"))
              lock = os.path.join(ctx.root, lock_rel)
              proj_dir = os.path.join(ctx.root, project)
              res = {"project": project, "lock": lock_rel, "fixed": [], "cascades": [], "unfixed": [], "aborted": ""}
              with open(lock, "rb") as f:
                  orig = f.read()
              ctx.restore[lock] = orig

              def unfixed(pkg, groups, fix, reason, detail=""):
                  ids = sorted({i for g in groups for i in g["ids"]})
                  res["unfixed"].append({
                      "package": pkg.name, "installed": ", ".join(sorted(set(pkg.installed))), "ids": ids,
                      "severity": sev_text(g["severity"] for g in groups), "fixed": fix, "reason": reason, "detail": detail,
                  })

              pkgs = extract(scan(ctx, project, lock_rel))
              for name in sorted(pkgs):
                  pkg = pkgs[name]
                  nofix = [g for g in pkg.groups if not g["fix"]]
                  todo = [g for g in pkg.groups if g["fix"]]
                  if nofix:
                      unfixed(pkg, nofix, "", "no-fixed-version")
                  if not todo:
                      continue
                  target = max_version([g["fix"] for g in todo])
                  lowest = min(pkg.installed, key=lambda v: (parse_version(v) or parse_version("0")).key)
                  low_v, target_v = parse_version(lowest), parse_version(target)
                  if low_v is not None and target_v <= low_v:
                      continue
                  pattern = excluded_by(name, ctx.excludes)
                  if pattern:
                      unfixed(pkg, todo, target, f"excluded (pattern '{pattern}')")
                      continue
                  if not ctx.allow_major and is_major(lowest, target):
                      unfixed(pkg, todo, target, f"major {lowest} -> {target}")
                      continue

                  with open(lock, "rb") as f:
                      before_bytes = f.read()
                  before = lock_versions(lock)
                  proc = run_uv(ctx, proj_dir, ["lock", "--upgrade-package", f"{name}=={target}"])
                  output = (proc.stdout or "") + (proc.stderr or "")
                  if proc.returncode != 0:
                      write_lock(lock, before_bytes)
                      if REFUSAL_RE.search(output):
                          unfixed(pkg, todo, target, "outside constraints", clean_text(output))
                          continue
                      raise UvError(f"uv lock failed for {name}=={target} in {project} (exit {proc.returncode}): {clean_text(output, 400)}")
                  try:
                      after = lock_versions(lock)
                  except (OSError, ValueError, tomllib.TOMLDecodeError):
                      write_lock(lock, before_bytes)
                      raise UvError(f"uv left an unreadable lock in {project}")
                  got = sorted(after.get(name, {}))
                  chosen = [v for v in got if parse_version(v) == target_v]
                  if not chosen:
                      write_lock(lock, before_bytes)
                      unfixed(pkg, todo, target, f"resolver chose {', '.join(got) or 'none'}")
                      continue
                  casc = lock_diff(before, after, name)
                  blocked = None
                  for other, (removed, added) in casc.items():
                      hit = excluded_by(other, ctx.excludes)
                      if hit:
                          blocked = (other, f"excluded (pattern '{hit}')")
                      elif removed and added and not ctx.allow_major and is_major(max_version(removed), max_version(added)):
                          blocked = (other, f"major {max_version(removed)} -> {max_version(added)}")
                      if blocked:
                          break
                  if blocked:
                      write_lock(lock, before_bytes)
                      unfixed(pkg, todo, target, f"cascade into {blocked[0]} ({blocked[1]})")
                      continue
                  for other, (removed, added) in casc.items():
                      res["cascades"].append({"package": name, "other": other, "from": "/".join(removed) or "-", "to": "/".join(added) or "-"})
                  res["fixed"].append({
                      "package": name, "from": lowest, "to": chosen[0],
                      "ids": sorted({i for g in todo for i in g["ids"]}),
                      "firsts": sorted({g["ids"][0] for g in todo}),
                      "severity": sev_text(g["severity"] for g in todo),
                  })

              if res["fixed"]:
                  report2 = scan(ctx, project, lock_rel)
                  remaining = set()
                  for r in as_list(as_dict(report2).get("results")):
                      for entry in as_list(as_dict(r).get("packages")):
                          for grp in as_list(as_dict(entry).get("groups")):
                              remaining.update(i for i in as_list(as_dict(grp).get("ids")) if isinstance(i, str))
                  claimed = {i for f in res["fixed"] for i in f["ids"]}
                  still = sorted(claimed & remaining)
                  if still:
                      write_lock(lock, orig)
                      res["aborted"] = "still reported " + ", ".join(still)
                      for f in res["fixed"]:
                          res["unfixed"].append({
                              "package": f["package"], "installed": f["from"], "ids": f["ids"], "severity": f["severity"],
                              "fixed": f["to"], "reason": "aborted: " + res["aborted"], "detail": "",
                          })
                      res["fixed"], res["cascades"] = [], []
              return res


          def load_projects(text, root):
              try:
                  raw = json.loads(text)
              except ValueError:
                  raise UsageError("--projects is not JSON")
              if not isinstance(raw, list) or not raw or not all(isinstance(p, str) for p in raw):
                  raise UsageError("--projects must be a non-empty JSON array of strings")
              out = set()
              for p in raw:
                  if not PROJECT_RE.match(p) or p.startswith("/") or ".." in p.split("/"):
                      raise UsageError("a project must be a relative path of [A-Za-z0-9._/-] without '..'")
                  n = posixpath.normpath(p)
                  if not os.path.isfile(os.path.join(root, n, "uv.lock")):
                      raise UsageError(f"{n}/uv.lock not found; every project needs a committed lock")
                  out.add(n)
              return sorted(out)


          def write(out, name, text):
              with open(os.path.join(out, name), "w", encoding="utf-8") as f:
                  f.write(text)


          def link(i):
              return f"[{i}](https://osv.dev/vulnerability/{i})"


          def uv_version(ctx):
              try:
                  proc = subprocess.run([ctx.uv, "--version"], capture_output=True, text=True)
                  return clean_text(proc.stdout.strip().splitlines()[0], 100) if proc.returncode == 0 and proc.stdout.strip() else "unknown"
              except OSError:
                  return "unknown"


          def write_outputs(ctx, results, out):
              fixed = [(r["project"], f) for r in results for f in r["fixed"]]
              claimed = sorted({(p, i) for p, f in fixed for i in f["ids"]})
              firsts = sorted({i for _, f in fixed for i in f["firsts"]})
              unfixed = [(r["project"], u) for r in results for u in r["unfixed"]]
              aborts = [(r["project"], r["aborted"]) for r in results if r["aborted"]]
              changed = []
              for r in results:
                  lock = os.path.join(ctx.root, r["lock"])
                  with open(lock, "rb") as f:
                      if f.read() != ctx.restore[lock]:
                          changed.append(r["lock"])
              digest = hashlib.sha256("".join(f"{p}\t{i}\n" for p, i in claimed).encode()).hexdigest()[:12]

              title = "fix(deps): patch " + ", ".join(firsts)
              if len(title) > 72:
                  title = f"fix(deps): patch {len(firsts)} Python advisories"

              write(out, "changed.txt", "true\n" if changed else "false\n")
              write(out, "unfixed.txt", "true\n" if unfixed or aborts else "false\n")
              write(out, "aborted.txt", "true\n" if aborts else "false\n")
              write(out, "locks.txt", "".join(f"{p}\n" for p in sorted(changed)))
              write(out, "hash.txt", digest + "\n")
              write(out, "ids.txt", "".join(f"{i}\n" for i in sorted({i for _, i in claimed})))
              write(out, "title.txt", title + "\n")
              write(out, "abort.tsv", "".join(f"{p}\t{cell(a)}\n" for p, a in aborts))
              write(out, "fixed.tsv", "".join(
                  f"{p}\t{f['package']}\t{f['from']}\t{f['to']}\t{','.join(f['ids'])}\t{f['severity']}\n" for p, f in fixed))
              write(out, "cascade.tsv", "".join(
                  f"{r['project']}\t{c['package']}\t{c['other']}\t{c['from']}\t{c['to']}\n" for r in results for c in r["cascades"]))
              write(out, "unfixed.tsv", "".join(
                  f"{p}\t{u['package']}\t{u['installed']}\t{','.join(u['ids'])}\t{u['severity']}\t{u['fixed']}\t{cell(u['reason'])}\n"
                  for p, u in unfixed))

              body = []
              if fixed:
                  body.append(f"Patches {len(claimed)} advisory id(s) in {len(changed)} uv.lock file(s). Only lock files change.")
                  for r in results:
                      if not r["fixed"]:
                          continue
                      body += ["", f"### {r['project']}"]
                      for f in r["fixed"]:
                          ids = ", ".join(link(i) for i in f["ids"])
                          body.append(f"- `{f['package']}` `{f['from']}` -> `{f['to']}`: {ids} (max severity {f['severity']})")
                      if r["cascades"]:
                          body += ["", "Also moved by the resolver:"]
                          for c in r["cascades"]:
                              body.append(f"- `{c['other']}` `{c['from']}` -> `{c['to']}` (pulled by `{c['package']}`)")
                  body += [
                      "",
                      f"- Resolver: `{uv_version(ctx)}`, `uv lock --upgrade-package <pkg>==<fixed>` per package.",
                      "- osv-scanner re-verified these IDs are gone from the patched locks.",
                      "- This PR is never auto-merged: review it and merge it by hand.",
                  ]
              write(out, "pr-body.md", "\n".join(body) + "\n" if body else "")

              issue = [MARKER, "Python advisories that `python-vuln-fix` will not patch automatically. Updated by the weekly run; never closed automatically.", ""]
              if unfixed:
                  issue += ["| project | package installed | ids | max severity | fixed | reason |", "| --- | --- | --- | --- | --- | --- |"]
                  for p, u in unfixed:
                      issue.append("| " + " | ".join(cell(x) for x in (
                          p, f"{u['package']} {u['installed']}", ", ".join(link(i) for i in u["ids"]), u["severity"], u["fixed"] or "none", u["reason"])) + " |")
                  for p, u in unfixed:
                      if u["detail"]:
                          issue += ["", f"#### {cell(p)} {cell(u['package'])}: uv output", "", "~~~", u["detail"], "~~~"]
              if aborts:
                  issue += ["", "### Automatic fix aborted"]
                  for p, a in aborts:
                      issue.append(f"- {cell(p)}: {cell(a)}; its lock was restored.")
              issue += ["", "Each reason says what blocks the fix: no fixed release, an excluded dependency, a major bump (needs `allow-major`), or a constraint in pyproject.toml."]
              write(out, "issue-body.md", "\n".join(issue) + "\n")

              print(f"projects: {len(results)}; fixed packages: {len(fixed)}; unfixed rows: {len(unfixed)}; aborted: {len(aborts)}; changed locks: {len(changed)}")
              return 0


          def cmd_run(args):
              root = os.path.abspath(args.root)
              excludes = parse_excludes(args.exclude)
              projects = load_projects(args.projects, root)

              def binary(x):
                  return os.path.abspath(x) if os.sep in x else (shutil.which(x) or x)

              ctx = Ctx(root, binary(args.osv_scanner), binary(args.uv), excludes, args.allow_major == "true")
              out = os.path.abspath(args.out)
              os.makedirs(out, exist_ok=True)
              results = []
              try:
                  for project in projects:
                      results.append(fix_project(ctx, project))
              except (UsageError, UvError):
                  for lock, data in ctx.restore.items():
                      write_lock(lock, data)
                  raise
              if Dropped.count:
                  print(f"::warning::dropped {Dropped.count} untrusted value(s) from the scanner output", file=sys.stderr)
              return write_outputs(ctx, results, out)


          def main(argv=None):
              ap = argparse.ArgumentParser(prog="python_vuln_fix.py")
              sub = ap.add_subparsers(dest="cmd", required=True)
              run = sub.add_parser("run")
              run.add_argument("--projects", required=True)
              run.add_argument("--out", required=True)
              run.add_argument("--osv-scanner", default="osv-scanner")
              run.add_argument("--uv", default="uv")
              run.add_argument("--exclude", default="")
              run.add_argument("--allow-major", choices=["true", "false"], default="false")
              run.add_argument("--root", default=".")
              args = ap.parse_args(argv)
              try:
                  return cmd_run(args)
              except UsageError as e:
                  print(f"python-vuln-fix: {e}", file=sys.stderr)
                  return 2
              except UvError as e:
                  print(f"python-vuln-fix: {e}", file=sys.stderr)
                  return 4


          if __name__ == "__main__":
              sys.exit(main())
          # <<< python-vuln-fix body
          PY

          out="$RUNNER_TEMP/python-vuln-fix"
          rc=0
          python3 "$RUNNER_TEMP/python_vuln_fix.py" run \
            --projects "$PROJECTS" \
            --out "$out" \
            --osv-scanner "$(command -v osv-scanner)" \
            --uv "$(command -v uv)" \
            --exclude "$EXCLUDE" \
            --allow-major "$ALLOW_MAJOR" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=python-vuln-fix::input or scanner error, no fix attempted"
            exit 2
          fi
          if [ "$rc" -eq 4 ]; then
            echo "::error title=python-vuln-fix::uv failed for a reason other than a resolver refusal (network, index, broken lock); every lock was restored, nothing was changed"
            exit 4
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          hash="$(cat "$out/hash.txt")"
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{12}$'; then
            echo "::error title=python-vuln-fix::unexpected dedupe hash, refusing to build a branch name from it"
            exit 1
          fi
          {
            echo "changed=$(cat "$out/changed.txt")"
            echo "unfixed=$(cat "$out/unfixed.txt")"
            echo "aborted=$(cat "$out/aborted.txt")"
            echo "hash=$hash"
          } >> "$GITHUB_OUTPUT"

      # A failed mint fails the job: a broken key must be visible, not silently
      # downgraded to a PR without CI.
      - name: Create GitHub App token
        id: app-token
        if: steps.fix.outputs.changed == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open fix PR
        id: pr
        if: steps.fix.outputs.changed == 'true'
        env:
          # App token when minted (CI runs on the PR), GITHUB_TOKEN otherwise.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base-branch || github.event.repository.default_branch }}
          HASH: ${{ steps.fix.outputs.hash }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/python-vuln-fix"
          branch="fix/py-vuln-$HASH"
          BASE="${BASE:-$(gh api "repos/$REPO" -q .default_branch)}"

          # Dedupe on the advisory set: same IDs -> same branch.
          existing=$(gh pr list --repo "$REPO" --head "$branch" --state all --json number,state)
          open_pr=$(jq -r '[.[] | select(.state == "OPEN")][0].number // empty' <<< "$existing")
          closed_pr=$(jq -r '[.[] | select(.state == "CLOSED")][0].number // empty' <<< "$existing")
          if [ -n "$open_pr" ]; then
            echo "::notice title=python-vuln-fix::PR #$open_pr already open for $branch"
            echo "action=skipped-open" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$closed_pr" ]; then
            echo "::notice title=python-vuln-fix::PR #$closed_pr for $branch was previously rejected; not reopening"
            echo "action=skipped-rejected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Base the branch on the commit that was scanned, so the committed
          # locks never overwrite a newer base-branch state.
          base_sha=$(git rev-parse HEAD)
          if ! gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_sha" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$branch" -f "sha=$base_sha" -F force=true > /dev/null
          fi

          title="$(head -n1 "$tmp/title.txt")"
          bumps="$(awk -F'\t' '{ printf "%s%s: %s %s -> %s", sep, $1, $2, $3, $4; sep = "; " }' "$tmp/fixed.tsv")"

          # createCommitOnBranch: GitHub signs the commit (Verified) and no git
          # credential is ever written to disk. Contents go through files
          # (--rawfile, --slurpfile): a uv.lock base64 exceeds the 128 KiB limit
          # of a single command-line argument.
          : > "$tmp/additions.jsonl"
          while IFS= read -r lock; do
            [ -n "$lock" ] || continue
            base64 < "$lock" | tr -d '\n' > "$tmp/lock.b64"
            jq -cn --arg path "$lock" --rawfile contents "$tmp/lock.b64" '{path: $path, contents: $contents}' >> "$tmp/additions.jsonl"
          done < "$tmp/locks.txt"
          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }' \
            --arg repo "$REPO" \
            --arg branch "$branch" \
            --arg oid "$base_sha" \
            --arg headline "$title" \
            --arg body "Bump to the fixed versions: $bumps" \
            --slurpfile additions "$tmp/additions.jsonl" \
            '{query: $query, variables: {input: {
               branch: {repositoryNameWithOwner: $repo, branchName: $branch},
               expectedHeadOid: $oid,
               message: {headline: $headline, body: $body},
               fileChanges: {additions: $additions}}}}' > "$tmp/commit.json"
          gh api graphql --input "$tmp/commit.json" > "$tmp/commit-result.json"
          jq -e '.data.createCommitOnBranch.commit.oid' "$tmp/commit-result.json" > /dev/null

          {
            if [ -z "$APP_SLUG" ]; then
              echo "**CI has not run on this PR.** It was opened with \`GITHUB_TOKEN\`, which by design starts no workflows. Close and reopen it (fires \`reopened\`) or push a commit to run CI before merging."
              echo
            fi
            cat "$tmp/pr-body.md"
          } > "$tmp/pr-body-final.md"

          pr_url=$(gh pr create --repo "$REPO" --base "$BASE" --head "$branch" --title "$title" --body-file "$tmp/pr-body-final.md")
          pr_number="${pr_url##*/}"

          # The new scan starts from the current base branch, so it is a
          # superset of any older automated fix PR: close those.
          # All author families stay matched, so PRs opened with GITHUB_TOKEN
          # before the App was configured are still closed.
          gh pr list --repo "$REPO" --state open --json number,headRefName,author --limit 100 \
            | jq -r --arg b "$branch" --arg slug "$APP_SLUG" '.[]
                | select(.headRefName | startswith("fix/py-vuln-"))
                | select(.headRefName != $b)
                | select(.author.login == "app/github-actions" or .author.login == "github-actions[bot]"
                    or ($slug != "" and (.author.login == "app/" + $slug or .author.login == $slug + "[bot]")))
                | .number' \
            | while read -r old; do
                gh pr close "$old" --repo "$REPO" --comment "Superseded by #$pr_number"
              done

          {
            echo "pr=$pr_url"
            echo "action=opened"
          } >> "$GITHUB_OUTPUT"

      # Dependabot's uv-security group, or a human, may land the same bump first.
      # The scan then finds nothing to fix, and an older fix PR would only
      # conflict: close it. Only when the scan completed and nothing was aborted,
      # so a failed run never closes a PR. Bots only: a human's branch with this
      # prefix is left alone.
      - name: Close stale fix PRs
        id: stale
        if: steps.fix.outputs.changed == 'false' && steps.fix.outputs.aborted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base-branch || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          closed=0
          for old in $(gh pr list --repo "$REPO" --state open --json number,headRefName,author --limit 100 \
            | jq -r '.[]
                | select(.headRefName | startswith("fix/py-vuln-"))
                | select(.author.is_bot == true)
                | .number'); do
            gh pr close "$old" --repo "$REPO" --comment "No fixable advisory remains on ${BASE:-the base branch}: it was fixed there, or osv-scanner no longer reports it."
            closed=$((closed + 1))
          done
          echo "closed=$closed" >> "$GITHUB_OUTPUT"

      - name: Update unfixed advisories issue
        id: issue
        if: steps.fix.outputs.unfixed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/python-vuln-fix"
          marker='<!-- python-vuln-fix:unfixed -->'
          title='security: Python advisories need a human'

          issues=$(gh issue list --repo "$REPO" --state open --json number,body --limit 200)
          number=$(jq -r --arg m "$marker" '[.[] | select(.body | contains($m))][0].number // empty' <<< "$issues")
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$title" --body-file "$out/issue-body.md"
            echo "action=issue-created" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(jq -r --arg n "$number" '.[] | select(.number == ($n | tonumber)) | .body' <<< "$issues" | tr -d '\r')
          if [ "$current" = "$(cat "$out/issue-body.md")" ]; then
            echo "action=issue-unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue edit "$number" --repo "$REPO" --body-file "$out/issue-body.md"
          gh issue comment "$number" --repo "$REPO" --body "The set of advisories python-vuln-fix cannot patch changed. The issue body has been updated."
          echo "action=issue-updated" >> "$GITHUB_OUTPUT"

      - name: Record
        if: always()
        env:
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          PR_ACTION: ${{ steps.pr.outputs.action }}
          ISSUE_ACTION: ${{ steps.issue.outputs.action }}
          STALE_CLOSED: ${{ steps.stale.outputs.closed }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/python-vuln-fix"
          date_utc=$(date -u +%Y-%m-%d)
          ids=none
          fixed=0
          unfixed=0
          if [ -s "$out/ids.txt" ]; then ids=$(paste -sd, - < "$out/ids.txt"); fi
          if [ -f "$out/fixed.tsv" ]; then fixed=$(wc -l < "$out/fixed.tsv" | tr -d ' '); fi
          if [ -f "$out/unfixed.tsv" ]; then unfixed=$(wc -l < "$out/unfixed.tsv" | tr -d ' '); fi
          action="${PR_ACTION:-no-pr}"
          if [ -n "${STALE_CLOSED:-}" ] && [ "$STALE_CLOSED" != 0 ]; then action="$action+closed-$STALE_CLOSED-stale"; fi
          if [ -n "$ISSUE_ACTION" ]; then action="$action+$ISSUE_ACTION"; fi
          if [ "$JOB_STATUS" != 'success' ]; then action="failed"; fi
          {
            echo '### Python vuln fix'
            echo
            echo '| Date (UTC) | Repo | IDs | Packages fixed | Packages unfixed | Action |'
            echo '| --- | --- | --- | --- | --- | --- |'
            echo "| $date_utc | $REPO | $ids | $fixed | $unfixed | $action |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=vuln-record::$date_utc $REPO $ids $action"
