name: Go Lint

on:
  workflow_call:
    inputs:
      golangci-lint-version:
        description: golangci-lint version to install (with or without a leading `v`). The single place the fleet's linter version is decided — bumping this bumps all six repos on their next CI run.
        required: false
        type: string
        default: v2.15.0
      timeout:
        description: golangci-lint --timeout value. A Go duration string (e.g. `5m`), not a number.
        required: false
        type: string
        default: 5m
      go-version-file:
        description: Path to the go.mod (or go.work) file used to resolve the Go toolchain version.
        required: false
        type: string
        default: go.mod
      args:
        description: Extra one-off flags appended to `golangci-lint run`. Repo-wide linter behavior (enabled linters, exclusions, settings) belongs in the caller's own .golangci.yml, not here.
        required: false
        type: string
        default: ""
      workflow-sync:
        description: "Run the fleet `workflow-sync` pre-commit hook at the caller's pinned `rev:` over the whole repo. Requires `- id: workflow-sync` under the promy-github-workflows entry of the caller's .pre-commit-config.yaml."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 2: pr-scope diffs the PR merge commit against its base parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Docs-only and release PRs (CHANGELOG.md + manifest) skip the expensive steps
      # but keep every job, so required check names still report. Fails open.
      # The block between the markers is byte-identical to scripts/pr-scope.sh.
      - name: Detect docs-only or release PR
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # >>> pr-scope body
          # Keep this block byte-identical between scripts/pr-scope.sh and every workflow
          # that inlines it (governance tests compare them).
          set +e
          out="${GITHUB_OUTPUT:-/dev/stdout}"

          # inert reports whether one path cannot affect any gate.
          inert() {
            case "$1" in
              *testdata*) return 1 ;; # fixtures are test inputs, whatever their extension
              .release-please-manifest.json) return 0 ;;
              docs/*.md) return 0 ;;
              */*) return 1 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          decide() {
            [ "${EVENT_NAME:-}" = "pull_request" ] || { reason="event is ${EVENT_NAME:-unset}, not pull_request"; return 1; }
            # A merge commit has two parents: "<sha> <p1> <p2>".
            [ "$(git rev-list --parents -n 1 HEAD 2>/dev/null | wc -w | tr -d ' ')" = 3 ] ||
              { reason="HEAD is not a merge commit with both parents fetched (checkout needs fetch-depth: 2)"; return 1; }
            local list n=0 f bad=""
            list="$(mktemp)"
            git diff --name-only -z --no-renames HEAD^1 HEAD >"$list" 2>/dev/null || { rm -f "$list"; reason="git diff failed"; return 1; }
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              if ! inert "$f"; then bad="$f"; break; fi
            done <"$list"
            rm -f "$list"
            # sanitised: the name lands in a workflow command
            [ -z "$bad" ] || { reason="${bad//[^[:alnum:]._\/-]/?} can affect a gate"; return 1; }
            [ "$n" -gt 0 ] || { reason="empty change set"; return 1; }
            reason="$n changed file(s), all docs or release metadata"
          }

          reason=""
          if decide; then skip=true; else skip=false; fi
          echo "skip=${skip}" >>"$out"
          echo "::notice title=pr-scope::skip=${skip}: ${reason}"
          # <<< pr-scope body

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Resolve golangci-lint version
        id: version
        env:
          RAW_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          # Normalize: strip a leading 'v' if present, then re-add it consistently,
          # so this input and .golangci-version's bare `2.15.0` are interchangeable.
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint binary
        id: cache
        if: steps.scope.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v${{ steps.version.outputs.version }}-${{ runner.os }}

      - name: Install golangci-lint
        if: steps.cache.outputs.cache-hit != 'true' && steps.scope.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # setup-go v7 defaults GOTOOLCHAIN to `local`, which makes `go install`
          # refuse any tool whose go.mod requires a newer Go than the caller's.
          # v5.6.0 defaulted to `auto`; restore that explicitly rather than
          # inherit whatever the action decides next.
          GOTOOLCHAIN: auto
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${VERSION}"

      - name: Print golangci-lint version
        if: steps.scope.outputs.skip != 'true'
        run: golangci-lint --version

      - name: Check .golangci-version drift
        if: hashFiles('.golangci-version') != '' && steps.scope.outputs.skip != 'true'
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PINNED_VERSION=$(tr -d '[:space:]' < .golangci-version)
          PINNED_VERSION="${PINNED_VERSION#v}"
          if [ "$PINNED_VERSION" != "$RESOLVED_VERSION" ]; then
            echo "::warning file=.golangci-version::.golangci-version pins v${PINNED_VERSION}, but this workflow resolved v${RESOLVED_VERSION}. Local lint runs (make lint, pre-commit) may diverge from CI until .golangci-version is updated."
          fi

      - name: Run golangci-lint
        if: steps.scope.outputs.skip != 'true'
        # Interpolate inputs via env rather than directly into the shell: inputs
        # are caller-controlled strings, and direct `${{ inputs.* }}` interpolation
        # into `run:` is a shell-injection surface. go-coverage.yml follows the
        # same convention.
        env:
          TIMEOUT: ${{ inputs.timeout }}
          ARGS: ${{ inputs.args }}
        run: |
          # `args` is intentionally word-split into separate flags, but a bare
          # $ARGS would also glob: `--skip-dirs *` would expand against the
          # workspace. read -ra splits on IFS without globbing.
          read -ra extra_args <<< "$ARGS"
          golangci-lint run --timeout="$TIMEOUT" "${extra_args[@]}"

      # These three were previously local-only (pre-commit hooks). Anyone pushing
      # without hooks installed bypassed them, so they now gate here too. All are
      # additive to a moving major: they only ever start passing repos that were
      # already clean locally, never fail a repo that wasn't already failing.
      - name: Check formatting
        if: steps.scope.outputs.skip != 'true'
        # `golangci-lint fmt --diff` prints a diff and exits non-zero when the
        # repo isn't formatted per its own .golangci.yml settings, and exits 0
        # when clean — verified directly, not assumed. No extra exit-code
        # plumbing needed: a non-zero exit here already fails the job.
        run: golangci-lint fmt --diff

      - name: Verify golangci-lint config
        if: steps.scope.outputs.skip != 'true'
        # Validates the caller's own .golangci.yml against the resolved
        # golangci-lint version's schema. Exits non-zero on an invalid or
        # missing config — verified directly.
        run: golangci-lint config verify

      - name: Check go.mod/go.sum tidiness
        if: steps.scope.outputs.skip != 'true'
        # `go mod tidy -diff` (Go 1.23+) prints a diff and exits non-zero when
        # go.mod/go.sum don't match what `go mod tidy` would produce, and exits
        # 0 when tidy — verified directly. Requires no network fetch beyond
        # what setup-go's module resolution already needs.
        run: go mod tidy -diff

      # Policy and code come from the caller's immutable hook `rev:`, so the local
      # hook and this step run the identical check. Folded into lint rather than a
      # separate reusable workflow: Actions bills each job rounded up to a minute.
      # setup-go has already run above, so pre-commit's `language: golang` builds
      # the hook with the caller's toolchain.
      - name: Check fleet governance (workflow-sync)
        # Runs even when an earlier lint step failed, so a PR sees every red at once.
        if: ${{ inputs.workflow-sync && !cancelled() }}
        env:
          PRE_COMMIT_VERSION: 4.6.0
        run: pipx run --spec "pre-commit==${PRE_COMMIT_VERSION}" pre-commit run workflow-sync --all-files --color=never
