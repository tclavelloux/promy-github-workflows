name: Go Lint

on:
  workflow_call:
    inputs:
      golangci-lint-version:
        description: golangci-lint version to install (with or without a leading `v`). The single place the fleet's linter version is decided — bumping this bumps all six repos on their next CI run.
        required: false
        type: string
        default: v2.13.2
      timeout:
        description: golangci-lint --timeout value. A Go duration string (e.g. `5m`), not a number.
        required: false
        type: string
        default: 5m
      go-version-file:
        description: Path to the go.mod (or go.work) file used to resolve the Go toolchain version.
        required: false
        type: string
        default: go.mod
      args:
        description: Extra one-off flags appended to `golangci-lint run`. Repo-wide linter behavior (enabled linters, exclusions, settings) belongs in the caller's own .golangci.yml, not here.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Resolve golangci-lint version
        id: version
        env:
          RAW_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          # Normalize: strip a leading 'v' if present, then re-add it consistently,
          # so this input and .golangci-version's bare `2.13.2` are interchangeable.
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint binary
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v${{ steps.version.outputs.version }}-${{ runner.os }}

      - name: Install golangci-lint
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${VERSION}"

      - name: Print golangci-lint version
        run: golangci-lint --version

      - name: Check .golangci-version drift
        if: hashFiles('.golangci-version') != ''
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PINNED_VERSION=$(tr -d '[:space:]' < .golangci-version)
          PINNED_VERSION="${PINNED_VERSION#v}"
          if [ "$PINNED_VERSION" != "$RESOLVED_VERSION" ]; then
            echo "::warning file=.golangci-version::.golangci-version pins v${PINNED_VERSION}, but this workflow resolved v${RESOLVED_VERSION}. Local lint runs (make lint, pre-commit) may diverge from CI until .golangci-version is updated."
          fi

      - name: Run golangci-lint
        # Interpolate inputs via env rather than directly into the shell: inputs
        # are caller-controlled strings, and direct `${{ inputs.* }}` interpolation
        # into `run:` is a shell-injection surface. go-coverage.yml follows the
        # same convention.
        env:
          TIMEOUT: ${{ inputs.timeout }}
          ARGS: ${{ inputs.args }}
        run: |
          # `args` is intentionally word-split into separate flags, but a bare
          # $ARGS would also glob: `--skip-dirs *` would expand against the
          # workspace. read -ra splits on IFS without globbing.
          read -ra extra_args <<< "$ARGS"
          golangci-lint run --timeout="$TIMEOUT" "${extra_args[@]}"

      # These three were previously local-only (pre-commit hooks). Anyone pushing
      # without hooks installed bypassed them, so they now gate here too. All are
      # additive to a moving major: they only ever start passing repos that were
      # already clean locally, never fail a repo that wasn't already failing.
      - name: Check formatting
        # `golangci-lint fmt --diff` prints a diff and exits non-zero when the
        # repo isn't formatted per its own .golangci.yml settings, and exits 0
        # when clean — verified directly, not assumed. No extra exit-code
        # plumbing needed: a non-zero exit here already fails the job.
        run: golangci-lint fmt --diff

      - name: Verify golangci-lint config
        # Validates the caller's own .golangci.yml against the resolved
        # golangci-lint version's schema. Exits non-zero on an invalid or
        # missing config — verified directly.
        run: golangci-lint config verify

      - name: Check go.mod/go.sum tidiness
        # `go mod tidy -diff` (Go 1.23+) prints a diff and exits non-zero when
        # go.mod/go.sum don't match what `go mod tidy` would produce, and exits
        # 0 when tidy — verified directly. Requires no network fetch beyond
        # what setup-go's module resolution already needs.
        run: go mod tidy -diff
