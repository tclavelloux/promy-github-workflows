name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This repo ships workflows to six services, so a bug here is a fleet-wide bug.
  # actionlint parses every workflow and runs shellcheck over each `run:` block —
  # it catches the two classes that have already bitten us: an apostrophe inside a
  # single-quoted awk program, and expression/type errors in `uses:` inputs.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          # Pinned in .actionlint-version so the version lives in one place,
          # mirroring how .golangci-version pins the fleet's linter.
          ACTIONLINT_VERSION_FILE: .actionlint-version
        run: |
          version="$(tr -d '[:space:]' < "$ACTIONLINT_VERSION_FILE")"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL "$url" | tar -xz -C /usr/local/bin actionlint
          actionlint --version

      # shellcheck is preinstalled on ubuntu-latest; actionlint shells out to it.
      - name: Lint workflows
        run: actionlint -color

      # Two duplications this repo cannot remove, so CI governs them instead:
      #  1. govulncheck version. A reusable workflow has no documented context
      #     exposing its own ref, so it cannot check out its own files at the
      #     pinned version. go-vuln.yml and go-vuln-fix.yml each carry the version
      #     as an input default; the hook reads .govulncheck-version.
      #     Drift would make CI, the fix PR and the pre-push hook disagree on findings.
      #  2. The fix logic. go-vuln-fix.yml inlines it (same limit);
      #     scripts/go-vuln-fix.sh is its locally testable twin. A diverging twin
      #     would make local tests prove nothing about what runs in CI.
      - name: Check govulncheck pin and go-vuln-fix body sync
        shell: bash
        run: |
          set -euo pipefail
          norm() { tr -d '[:space:]' | sed 's/^v//'; }
          pin="$(norm < .govulncheck-version)"
          vuln="$(yq '.on.workflow_call.inputs.govulncheck-version.default' .github/workflows/go-vuln.yml | norm)"
          fix="$(yq '.on.workflow_call.inputs.govulncheck-version.default' .github/workflows/go-vuln-fix.yml | norm)"
          echo ".govulncheck-version=$pin go-vuln.yml=$vuln go-vuln-fix.yml=$fix"
          if [ "$pin" != "$vuln" ]; then
            echo "::error file=.github/workflows/go-vuln.yml::govulncheck default ($vuln) != .govulncheck-version ($pin)"
            exit 1
          fi
          if [ "$pin" != "$fix" ]; then
            echo "::error file=.github/workflows/go-vuln-fix.yml::govulncheck default ($fix) != .govulncheck-version ($pin)"
            exit 1
          fi

          between() { sed -n '/# >>> go-vuln-fix body/,/# <<< go-vuln-fix body/p'; }
          between < scripts/go-vuln-fix.sh > /tmp/body-script.txt
          between < .github/workflows/go-vuln-fix.yml | sed 's/^          //' > /tmp/body-workflow.txt
          if [ ! -s /tmp/body-script.txt ] || [ ! -s /tmp/body-workflow.txt ]; then
            echo "::error file=scripts/go-vuln-fix.sh::go-vuln-fix body markers missing in the script or the workflow"
            exit 1
          fi
          if ! diff -u /tmp/body-script.txt /tmp/body-workflow.txt; then
            echo "::error file=.github/workflows/go-vuln-fix.yml::inlined body differs from scripts/go-vuln-fix.sh"
            exit 1
          fi

  # zizmor audits the same workflows for security anti-patterns actionlint doesn't
  # check: unpinned action refs, credential persistence, template-injection, etc.
  # Same fleet-wide blast radius as actionlint, so it gets the same treatment.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        env:
          # Pinned in .zizmor-version, mirroring .actionlint-version. Installed
          # from the released binary (not `uvx zizmor`) so this job needs no
          # Python/uv toolchain — same reasoning as actionlint's own install step.
          ZIZMOR_VERSION_FILE: .zizmor-version
        run: |
          version="$(tr -d '[:space:]' < "$ZIZMOR_VERSION_FILE")"
          url="https://github.com/zizmorcore/zizmor/releases/download/v${version}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz -C /usr/local/bin zizmor
          zizmor --version

      - name: Audit workflows
        run: zizmor --persona=regular .github/workflows/

  # Go tests include governance_test.go, which fails when the policy constants in
  # internal/syncheck/policy.go drift from go-coverage.yml, go-lint.yml,
  # pr-title.yml or templates/. Same role as the govulncheck pin step above:
  # CI governs a duplication this repo cannot remove.
  workflow-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $(echo "$unformatted" | tr '\n' ' ')"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...
