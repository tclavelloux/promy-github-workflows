name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This repo ships workflows to six services, so a bug here is a fleet-wide bug.
  # actionlint parses every workflow and runs shellcheck over each `run:` block —
  # it catches the two classes that have already bitten us: an apostrophe inside a
  # single-quoted awk program, and expression/type errors in `uses:` inputs.
  actionlint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          # Pinned in .actionlint-version so the version lives in one place,
          # mirroring how .golangci-version pins the fleet's linter. The tarball
          # digest sits beside it in .actionlint-sha256.
          ACTIONLINT_VERSION_FILE: .actionlint-version
          ACTIONLINT_SHA256_FILE: .actionlint-sha256
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "$ACTIONLINT_VERSION_FILE")"
          expected="$(tr -d '[:space:]' < "$ACTIONLINT_SHA256_FILE")"
          asset="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${asset}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$url"
          # Verify against the pinned digest, not against a checksum file fetched
          # from the same release: a tampered release would ship a matching file.
          actual="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=.actionlint-sha256::actionlint v${version} sha256 is ${actual}, expected ${expected}. If you changed .actionlint-version, update .actionlint-sha256 in the same PR."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$asset" -C /usr/local/bin actionlint
          actionlint --version

      # shellcheck is preinstalled on ubuntu-latest; actionlint shells out to it.
      - name: Lint workflows
        run: actionlint -color

      # Two duplications this repo cannot remove, so CI governs them instead:
      #  1. govulncheck version. A reusable workflow has no documented context
      #     exposing its own ref, so it cannot check out its own files at the
      #     pinned version. go-vuln.yml and go-vuln-fix.yml each carry the version
      #     as an input default; the hook reads .govulncheck-version.
      #     Drift would make CI, the fix PR and the pre-push hook disagree on findings.
      #  2. The fix logic. go-vuln-fix.yml inlines it (same limit);
      #     scripts/go-vuln-fix.sh is its locally testable twin. A diverging twin
      #     would make local tests prove nothing about what runs in CI.
      - name: Check govulncheck pin and go-vuln-fix body sync
        shell: bash
        run: |
          set -euo pipefail
          norm() { tr -d '[:space:]' | sed 's/^v//'; }
          pin="$(norm < .govulncheck-version)"
          vuln="$(yq '.on.workflow_call.inputs.govulncheck-version.default' .github/workflows/go-vuln.yml | norm)"
          fix="$(yq '.on.workflow_call.inputs.govulncheck-version.default' .github/workflows/go-vuln-fix.yml | norm)"
          echo ".govulncheck-version=$pin go-vuln.yml=$vuln go-vuln-fix.yml=$fix"
          if [ "$pin" != "$vuln" ]; then
            echo "::error file=.github/workflows/go-vuln.yml::govulncheck default ($vuln) != .govulncheck-version ($pin)"
            exit 1
          fi
          if [ "$pin" != "$fix" ]; then
            echo "::error file=.github/workflows/go-vuln-fix.yml::govulncheck default ($fix) != .govulncheck-version ($pin)"
            exit 1
          fi

          between() { sed -n '/# >>> go-vuln-fix body/,/# <<< go-vuln-fix body/p'; }
          between < scripts/go-vuln-fix.sh > /tmp/body-script.txt
          between < .github/workflows/go-vuln-fix.yml | sed 's/^          //' > /tmp/body-workflow.txt
          if [ ! -s /tmp/body-script.txt ] || [ ! -s /tmp/body-workflow.txt ]; then
            echo "::error file=scripts/go-vuln-fix.sh::go-vuln-fix body markers missing in the script or the workflow"
            exit 1
          fi
          if ! diff -u /tmp/body-script.txt /tmp/body-workflow.txt; then
            echo "::error file=.github/workflows/go-vuln-fix.yml::inlined body differs from scripts/go-vuln-fix.sh"
            exit 1
          fi

  # zizmor audits the same workflows for security anti-patterns actionlint doesn't
  # check: unpinned action refs, credential persistence, template-injection, etc.
  # Same fleet-wide blast radius as actionlint, so it gets the same treatment.
  zizmor:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned in .zizmor-version, mirroring .actionlint-version; the tarball
      # digest sits beside it in .zizmor-sha256.
      - name: Read zizmor pin
        id: pin
        run: |
          echo "version=$(tr -d '[:space:]' < .zizmor-version)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(tr -d '[:space:]' < .zizmor-sha256)" >> "$GITHUB_OUTPUT"

      # Installed from the released binary (not `uvx zizmor`) so this job needs no
      # Python/uv toolchain. The block between the `zizmor install` markers is the
      # one the lint workflows inline for callers (a Go test keeps them
      # byte-identical), so every PR here runs the code callers get.
      - name: Install zizmor
        env:
          RAW_VERSION: ${{ steps.pin.outputs.version }}
          EXPECTED_SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          # >>> zizmor install
          set -euo pipefail
          version="${RAW_VERSION#v}"
          asset="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/zizmorcore/zizmor/releases/download/v${version}/${asset}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$url"
          actual="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::zizmor v${version} sha256 is ${actual}, expected ${EXPECTED_SHA256}. If you changed zizmor-version, pass the matching zizmor-sha256."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" zizmor
          install -m 0755 "$RUNNER_TEMP/zizmor" /usr/local/bin/zizmor
          zizmor --version
          # <<< zizmor install

      - name: Audit workflows
        run: zizmor --persona=regular .github/workflows/

      # Callers copy templates/zizmor.yml to .github/zizmor.yml so zizmor accepts
      # governance `<name>/v<major>` refs. This audits every caller shape the
      # workflow-sync fixtures and templates ship, under that same config.
      # templates/ci-automerge-job.yml is a job fragment, not a workflow.
      - name: Audit caller templates and fixtures
        shell: bash
        run: |
          set -euo pipefail
          zizmor --persona=regular --config templates/zizmor.yml \
            internal/syncheck/testdata/pass-*/.github/workflows/ \
            templates/release-please.yml \
            templates/go-vuln-fix-caller.yml \
            templates/docs/ci.yml \
            templates/flutter/ci.yml \
            templates/python/ci.yml \
            templates/python/vuln-fix.yml

  # Go tests include governance_test.go, which fails when the policy constants in
  # internal/syncheck/policy.go drift from go-coverage.yml, go-lint.yml,
  # pr-title.yml or templates/. Same role as the govulncheck pin step above:
  # CI governs a duplication this repo cannot remove.
  workflow-sync:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $(echo "$unformatted" | tr '\n' ' ')"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  # scripts/python_pins.py and scripts/python_coverage_floor.py are inlined into
  # python-lint.yml and python-test.yml (a reusable workflow cannot read its own
  # files). The Go tests above keep each inlined block byte-identical to its
  # script; these tests prove the scripts catch each drift class. ubuntu-latest
  # ships Python 3.12; the scripts need 3.11+ for tomllib and say so if it is older.
  python-scripts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit-test the Python check scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/tests -v

  # govulncheck over this repo's own Go code (the workflow-sync binary every fleet
  # repo runs). The version comes from .govulncheck-version; the actionlint job
  # holds go-vuln.yml and go-vuln-fix.yml equal to it. No exemption list: a
  # finding here fails the PR.
  vuln:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        env:
          # setup-go v7 defaults to `local`; the pinned govulncheck needs a newer Go.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .govulncheck-version)"
          go install "golang.org/x/vuln/cmd/govulncheck@v${version#v}"
          govulncheck ./...

  # golangci-lint over this repo's own Go code, default config. The version is the
  # `golangci-lint-version` default of go-lint.yml (this repo has no
  # .golangci-version), so it lints with what the fleet lints with.
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        env:
          # setup-go v7 defaults GOTOOLCHAIN to `local`, which makes `go install`
          # refuse a tool whose go.mod needs a newer Go; go-lint.yml restores `auto`.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          version="$(yq '.on.workflow_call.inputs.golangci-lint-version.default' .github/workflows/go-lint.yml | tr -d '[:space:]')"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${version#v}"
          golangci-lint run ./...

  gitleaks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks-action reads GET /repos/{repo}/pulls/{n}/commits to scope the scan
    # to the PR's commit range, so it needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
