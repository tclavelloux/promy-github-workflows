name: Flutter Lint

# Installs the Flutter SDK from the caller's .flutter-version (one plain X.Y.Z),
# then runs `dart format` and `dart analyze --fatal-infos`. subosito/flutter-action
# cannot read a plain .flutter-version, so the Resolve step feeds `flutter-version`.
# Check name: `lint / lint`.

on:
  workflow_call:
    inputs:
      workflow-sync:
        description: "Run the fleet `workflow-sync` pre-commit hook at the caller's pinned `rev:` over the whole repo. Requires `- id: workflow-sync` under the promy-github-workflows entry of the caller's .pre-commit-config.yaml, and adds setup-go for that one step."
        required: false
        type: boolean
        default: false
      zizmor:
        description: "Run zizmor (`--persona=regular`) over the caller's `.github/workflows/`. The caller's `.github/zizmor.yml` (copied from `templates/zizmor.yml`) is auto-discovered; without it zizmor's default hash-pin policy flags every governance `<name>/v<major>` ref."
        required: false
        type: boolean
        default: false
      zizmor-version:
        description: zizmor version to install (with or without a leading `v`). A different version needs its own `zizmor-sha256`.
        required: false
        type: string
        default: 1.32.0
      zizmor-sha256:
        description: Expected sha256 of the `zizmor-x86_64-unknown-linux-gnu.tar.gz` release asset for `zizmor-version`. The download is rejected on any mismatch.
        required: false
        type: string
        default: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Flutter version
        id: flutter
        run: |
          # .flutter-version is the repo's pin; a missing pin is an error, never "latest".
          if [ ! -s .flutter-version ]; then
            echo "::error file=.flutter-version::.flutter-version is missing or empty. It is the source of truth for the Flutter SDK version."
            exit 1
          fi
          version="$(head -n1 .flutter-version | tr -d '[:space:]')"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=.flutter-version::.flutter-version must hold one plain version such as 3.50.0, found '${version}'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Install dependencies
        id: deps
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # Runs after a format failure, never after a failed setup: without the SDK or
      # resolved packages it only buries the root cause under unresolved imports.
      - name: Analyze
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: dart analyze --fatal-infos

      # Policy and code come from the caller's immutable hook `rev:`, so the local
      # hook and this step run the identical check. Folded into lint rather than a
      # separate reusable workflow: Actions bills each job rounded up to a minute.
      # A Flutter repo has no go.mod, and the hook is `language: golang`, so Go is
      # set up here for this step only.
      - name: Set up Go for workflow-sync
        if: ${{ inputs.workflow-sync && !cancelled() }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Check fleet governance (workflow-sync)
        if: ${{ inputs.workflow-sync && !cancelled() }}
        env:
          PRE_COMMIT_VERSION: 4.6.0
        run: pipx run --spec "pre-commit==${PRE_COMMIT_VERSION}" pre-commit run workflow-sync --all-files --color=never

      # Verified against the pinned digest, not a checksum file fetched from the
      # same release: zizmor publishes none, and a tampered release would ship a
      # matching one.
      - name: Install zizmor
        if: ${{ inputs.zizmor && !cancelled() }}
        env:
          RAW_VERSION: ${{ inputs.zizmor-version }}
          EXPECTED_SHA256: ${{ inputs.zizmor-sha256 }}
        run: |
          # >>> zizmor install
          set -euo pipefail
          version="${RAW_VERSION#v}"
          asset="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/zizmorcore/zizmor/releases/download/v${version}/${asset}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$url"
          actual="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::zizmor v${version} sha256 is ${actual}, expected ${EXPECTED_SHA256}. If you changed zizmor-version, pass the matching zizmor-sha256."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" zizmor
          install -m 0755 "$RUNNER_TEMP/zizmor" /usr/local/bin/zizmor
          zizmor --version
          # <<< zizmor install

      # Does not require .github/zizmor.yml. Without it zizmor's own blanket
      # hash-pin policy reports the governance refs: the intended failure signal.
      # No GitHub token is passed, so online audits stay off.
      - name: Audit workflows (zizmor)
        if: ${{ inputs.zizmor && !cancelled() }}
        run: zizmor --persona=regular .github/workflows/
