# Canonical .github/workflows/release-please.yml for every fleet repo: Go,
# Python, and promy-frontend (copy by hand; it has no workflow-sync profile).
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    # Must match the reusable workflow's permissions exactly; it can only narrow.
    permissions:
      contents: write
      pull-requests: write
    uses: tclavelloux/promy-github-workflows/.github/workflows/release-please.yml@release-please/v1
    # Defaults match the fleet. Set `config-file` / `manifest-file` under `with:`
    # only if the repo keeps them elsewhere.
    # Optional. Without them the release PR is opened with GITHUB_TOKEN and CI
    # does not run on it. Map explicitly; never `secrets: inherit`.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
