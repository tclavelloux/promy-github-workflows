[project]
name = "app"
version = "0.1.0"
description = "fixture: a uv project with tests, a Dockerfile and expiring osv ignores"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.17.4,<0.18",
    # comments and trailing commas inside arrays are valid TOML
    "requests>=2.32.4,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", 'basedpyright>=1.31']

[tool.uv]
package = false
required-version = ">=0.12.18"
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.deptry]
package_module_name_map = { beautifulsoup4 = "bs4" }

[tool.pytest.ini_options]
addopts = "--disable-socket --strict-markers"
markers = [
    "network: needs the network",
]

[tool.coverage.run]
source = ["src/job"]

[tool.coverage.report]
# Floor = floor(measured coverage). Raise it when coverage grows, never lower it.
fail_under = 94
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]
